[package]
name = "webnn-graph"
version = "0.4.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "Simple DSL for WebNN graphs"
repository = "https://github.com/rustnn/webnn-graph"
# The ResNet example weights are 8 MiB; crates.io caps a package at 10 MiB.
exclude = ["/examples/resnet_head.weights"]

[lib]
name = "webnn_graph"
path = "src/lib.rs"

[[bin]]
name = "webnn-graph"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["onnx", "cli"]
cli = ["dep:clap"]
onnx = ["dep:webnn-onnx-utils", "dep:prost"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.7"
half = "2.7.1"
thiserror = "1.0"
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.5", features = ["derive"], optional = true }
base64 = "0.22"
prost = { version = "0.12", optional = true }
webnn-onnx-utils = { version = "0.1.1", optional = true }

[dev-dependencies]
tempfile = "3.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
